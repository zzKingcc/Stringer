<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型设置 · Stringer 管控台</title>
    <link rel="stylesheet" href="assets/console.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-head">
            <div class="head-line" style="align-items:center;">
                <div><h2>模型设置</h2></div>
                <span class="count-badge" id="modelCount">—</span>
                <button class="ghost" id="addModelBtn">+ 添加模型</button>
            </div>
        </div>

        <div class="info-box">
            <div class="line"><b>接入模型</b> —— 点右上角「添加模型」登记一个连接。</div>
            <div class="line">配置文件：<span class="mono" id="settingsFileHint">—</span></div>
        </div>

        <!-- ============ 模型卡片列表：一个模型一张卡片 ============ -->
        <div id="modelList">
            <div class="card perm-none">加载中…</div>
        </div>

        <!-- ============ 添加 / 编辑模型：遮罩层弹窗 ============
             MODE 三态：profile（自定义模型档案）/ chat（对话模型）/ embedding（向量模型）
             字段按模式显隐（见 openModal） -->
        <div class="modal-mask" id="profileModal" hidden>
            <div class="modal-panel" role="dialog" aria-modal="true"
                 aria-labelledby="profileModalTitle">
                <div class="modal-head">
                    <h3 id="profileModalTitle">添加模型</h3>
                    <span class="spacer"></span>
                    <button type="button" class="modal-close" id="profileModalClose"
                            aria-label="关闭">×</button>
                </div>

                <div class="hint" style="margin:0 0 14px;">
                    <b>本地 Ollama</b>：地址填 <span class="mono">http://localhost:11434/v1</span>（<b>必带 /v1</b>）；
                    API Key 随便填个非空占位（如 <span class="mono">ollama</span>）；模型名取
                    <span class="mono">ollama list</span> 里的名字（带 tag，如 <span class="mono">qwen2.5:7b</span>）。
                </div>

                <div class="field" id="fBaseUrl">
                    <label>服务商地址（OpenAI 兼容 baseUrl）</label>
                    <input id="pfBaseUrl" class="mono" placeholder="https://api.example.com/v1">
                    <div class="help" id="hBaseUrl" hidden></div>
                </div>

                <div class="row">
                    <div class="field">
                        <label>API Key</label>
                        <input id="pfApiKey" type="password" class="mono" placeholder="必填">
                    </div>
                    <div class="field">
                        <label>模型名</label>
                        <div class="combo">
                            <input id="pfModelName" class="mono" placeholder="gpt-4o"
                                   autocomplete="off" role="combobox" aria-expanded="false"
                                   aria-controls="pfModelMenu" aria-autocomplete="list">
                            <button type="button" class="combo-btn" title="从服务商获取模型列表"
                                    aria-label="展开模型列表">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                     stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                            </button>
                            <div class="combo-menu" id="pfModelMenu" role="listbox"
                                 aria-label="模型候选" style="display:none;"></div>
                        </div>
                        <div class="help">点右侧按钮拉取候选（仅候选池）。</div>
                    </div>
                </div>

                <div class="field" id="fProbe">
                    <label>模型能力</label>
                    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                        <span id="pfTypeLabel"></span>
                        <button type="button" class="sec" id="probeBtn">探测</button>
                        <span class="hint" id="probeResult" style="margin:0;"></span>
                    </div>
                </div>

                <div class="row" id="rowTempTokens">
                    <div class="field">
                        <label>采样温度（可空）</label>
                        <input id="pfTemperature" type="number" step="0.1" min="0" max="2" placeholder="0.3">
                    </div>
                    <div class="field">
                        <label>单次最大 Token（可空）</label>
                        <input id="pfMaxTokens" type="number" min="1" placeholder="4096">
                    </div>
                </div>

                <div class="field" id="fDimensions" hidden>
                    <label>向量维度（留空 = 服务商默认维度）</label>
                    <input id="pfDimensions" type="number" min="1" step="1" placeholder="留空则用模型默认维度">
                    <div class="help">
                        向量维度必须与 ES 索引 mapping 一致；<b>改维度后必须重建知识库索引</b>，
                        否则新旧向量长度不符，写入会被 ES 拒绝。
                    </div>
                </div>

                <div id="profileResult" class="result"></div>

                <footer class="card-foot">
                    <button class="sec" id="resetProfileFormBtn">清空表单</button>
                    <button id="saveProfileBtn">保存</button>
                    <span class="hint" id="modalHint"></span>
                </footer>
            </div>
        </div>
    </main>
</div>

<script src="assets/console.js"></script>
<script>
    /* ============ 模型设置 ============
       一个模型一张卡片：配置文件（config/llm-settings.json）里的「对话模型 / 向量模型」两张，
       外加用户自建的模型档案。右上角「添加模型」→ 遮罩层弹窗。
       域 → 模型的绑定在「域空间」页操作。 */
    Console.renderSidebar('models');

    var PROFILES = [];
    var SETTINGS = null;              /* /admin/settings：对话 / 向量 两个模型的配置 */

    /* 弹窗模式：profile=自建档案 / chat=对话模型 / embedding=向量模型 */
    var MODE = 'profile';
    var EDIT_ALIAS = null;            /* 正在编辑的档案别名（别名已不在表单里，编辑时靠它定位） */

    /* 当前表单探测到的能力画像：端点族 / 输入模态 / 输出模态 / 布尔能力（都可多选） */
    var PFEPS = [];
    var PFIN = [];
    var PFOUT = [];
    var PFCAPS = [];
    var PFKNOWN = false;
    /* 端点族 → 该端点下要展示的配置组。以后加音频 / 视频，就在这里加一条即可 */
    var EP_FIELDS = { chat: ['rowTempTokens'], embedding: ['fDimensions'] };
    /* 展示用的中文名 */
    var EP_LABEL = { chat: '对话', embedding: '向量', rerank: '重排', images: '生图',
                     tts: '语音合成', asr: '语音识别', video: '视频' };
    var MOD_LABEL = { text: '文本', image: '图片', audio: '音频', video: '视频',
                      file: '文件', embedding: '向量' };
    var CAP_LABEL = { streaming: '流式', tools: '工具调用' };

    function pfEl(id) { return document.getElementById(id); }
    function show(id, on) { pfEl(id).hidden = !on; }
    function val(id) { var v = pfEl(id).value.trim(); return v === '' ? null : v; }
    function num(id) { var v = pfEl(id).value.trim(); return v === '' ? null : Number(v); }

    /* ---------- 加载 ---------- */
    function loadSettings() {
        return Console.request('/admin/settings').then(function (s) {
            SETTINGS = s;
            pfEl('settingsFileHint').textContent = s.settingsFile || '—';
            Console.setModelsWarn(!s.chatConfigured);
            renderProfiles();
        }).catch(function (e) {
            console.debug('[stringer] 读取设置失败：', e);
        });
    }

    function loadProfiles() {
        return Console.request('/admin/model-profiles').then(function (r) {
            PROFILES = (r && r.profiles) || [];
            renderProfiles();
        }).catch(function (e) {
            pfEl('modelList').innerHTML = '<div class="card" style="color:var(--red);">'
                + '加载失败：' + Console.escapeHtml(e.message) + '</div>';
        });
    }

    /* ---------- 渲染 ---------- */
    function kv(k, v) { return '<div><span class="k">' + k + '</span>' + v + '</div>'; }
    function monoOrNone(v) {
        return v ? '<span class="mono">' + Console.escapeHtml(v) + '</span>'
                 : '<span class="perm-none">未配置</span>';
    }
    /* 卡片头统一为「模型：<模型名>」，不再区分对话 / 向量 */
    function modelTitle(name) { return '模型：' + monoOrNone(name); }

    /* 小标渲染：只列探到的（不显示未支持的） */
    function tagList(list, labelMap) {
        return (list || []).map(function (k) {
            return '<span class="tag public">' + Console.escapeHtml(labelMap[k] || k) + '</span>';
        }).join('');
    }

    /* 卡片头部：端点族 + 输入模态 + 布尔能力（输出模态放 meta，避免"文本/向量"重复） */
    function cardTags(p) {
        return tagList(p.endpoints, EP_LABEL) + tagList(p.input, MOD_LABEL) + tagList(p.capabilities, CAP_LABEL);
    }

    /* 同名模型（两家服务商各配一份）自动编号：别名 = 模型名[-N]，卡片上显示 #N */
    function aliasBase(modelName) {
        return (modelName || '').trim().replace(/\s+/g, '-') || 'model';
    }
    function dupNo(p) {
        var base = aliasBase(p.modelName);
        var alias = (p.alias || '').trim();
        if (alias === base) { return 0; }
        var m = alias.match(/-(\d+)$/);
        return (m && alias.slice(0, m.index) === base) ? parseInt(m[1], 10) : 0;
    }
    function dupBadge(p) {
        var n = dupNo(p);
        return n > 1 ? '<span class="mbadge mono">#' + n + '</span>' : '';
    }

    /* 配置框按探测结果自适应：端点族与配置组都等探测之后才出现 */
    function applyProbeFields() {
        show('pfTypeLabel', PFKNOWN);
        var groups = [];
        PFEPS.forEach(function (ep) {
            (EP_FIELDS[ep] || []).forEach(function (g) {
                if (groups.indexOf(g) < 0) { groups.push(g); }
            });
        });
        ['rowTempTokens', 'fDimensions'].forEach(function (id) {
            show(id, groups.indexOf(id) >= 0);
        });
        pfEl('pfTypeLabel').innerHTML = tagList(PFEPS, EP_LABEL)
            + tagList(PFKNOWN ? PFIN : [], MOD_LABEL)
            + tagList(PFCAPS, CAP_LABEL);
    }

    function builtinEmbeddingCard(s) {
        var base = s.embeddingBaseUrl
            ? '<span class="mono">' + Console.escapeHtml(s.embeddingBaseUrl) + '</span>'
            : '<span class="perm-none">未配置</span>';
        return '<section class="card model-card">'
            + '<header class="card-head">'
            +   '<span class="model-dot"></span>'
            +   '<h2>' + modelTitle(s.embeddingModelName) + '</h2>'
            +   tagList(s.embeddingCapabilities, CAP_LABEL)
            +   '<span class="mbadge ' + (s.embeddingConfigured ? 'ok' : 'off') + '">'
            +      (s.embeddingConfigured ? '已就绪' : '未配置') + '</span>'
            +   '<span class="spacer"></span>'
            +   '<button class="ghost" data-edit-builtin="embedding">编辑</button>'
            +   '<button class="ghost" data-del-builtin="embedding">删除</button>'
            + '</header>'
            + '<div class="model-meta">'
            +   kv('服务商地址', base)
            +   kv('向量维度', s.embeddingDimensions == null
                    ? '<span class="perm-none">按模型默认</span>' : s.embeddingDimensions)
            +   kv('API Key', s.embeddingApiKeyMasked
                    ? '<span class="mono">' + Console.escapeHtml(s.embeddingApiKeyMasked) + '</span>'
                    : '<span class="perm-none">未配置</span>')
            + '</div>'
            + '</section>';
    }

    function renderProfiles() {
        var box = pfEl('modelList');
        var html = '';

        /* 配置文件里的向量模型（知识库 / 检索这条链路），按「模型：name」展示 */
        if (SETTINGS) { html += builtinEmbeddingCard(SETTINGS); }

        PROFILES.forEach(function (p) {
            var used = (p.usedByDomains || []).length
                ? p.usedByDomains.map(function (d) {
                    return '<span class="tag perm">' + Console.escapeHtml(d) + '</span>';
                  }).join('')
                : '<span class="perm-none">未绑定任何域</span>';
            html += '<section class="card model-card">'
                + '<header class="card-head">'
                +   '<span class="model-dot"></span>'
                +   '<h2>' + modelTitle(p.modelName || p.alias) + '</h2>'
                +   dupBadge(p)
                +   cardTags(p)
                +   '<span class="spacer"></span>'
                +   '<button class="ghost" data-edit="' + Console.escapeHtml(p.alias) + '">编辑</button>'
                +   '<button class="ghost" data-test="' + Console.escapeHtml(p.alias) + '">测试</button>'
                +   '<button class="ghost" data-del="' + Console.escapeHtml(p.alias) + '">删除</button>'
                + '</header>'
                + '<div class="model-meta">'
                +   '<div><span class="k">输出模态</span>'
                +      (tagList(p.output, MOD_LABEL) || '<span class="perm-none">—</span>') + '</div>'
                +   '<div><span class="k">服务商地址</span><span class="mono">'
                +      Console.escapeHtml(p.baseUrl || '-') + '</span></div>'
                + (p.dimensions == null ? ''
                    : '<div><span class="k">向量维度</span>' + p.dimensions + '</div>')
                +   '<div><span class="k">被哪些域使用</span>' + used + '</div>'
                + '</div>'
                + '</section>';
        });

        box.innerHTML = html;

        box.querySelectorAll('button[data-edit-builtin]').forEach(function (b) {
            b.addEventListener('click', function () { openBuiltin(b.getAttribute('data-edit-builtin')); });
        });
        box.querySelectorAll('button[data-del-builtin]').forEach(function (b) {
            b.addEventListener('click', function () { deleteBuiltin(b.getAttribute('data-del-builtin')); });
        });
        box.querySelectorAll('button[data-edit]').forEach(function (b) {
            b.addEventListener('click', function () { openProfileEdit(b.getAttribute('data-edit')); });
        });
        box.querySelectorAll('button[data-test]').forEach(function (b) {
            b.addEventListener('click', function () { testProfile(b.getAttribute('data-test')); });
        });
        box.querySelectorAll('button[data-del]').forEach(function (b) {
            b.addEventListener('click', function () { deleteProfile(b.getAttribute('data-del')); });
        });

        /* 页头右侧数量统计：向量一个（内置配置）+ 自建模型数 */
        pfEl('modelCount').textContent = ((SETTINGS ? 1 : 0) + PROFILES.length) + ' 个模型';
    }

    /* ---------- 弹窗：开 / 关 / 重置 ---------- */
    function openModal(mode, title) {
        MODE = mode;
        if (mode === 'chat' || mode === 'embedding') {
            PFEPS = [mode];
            PFIN = ['text'];
            PFOUT = (mode === 'embedding') ? ['embedding'] : ['text'];
            PFCAPS = [];
            PFKNOWN = true;
        }
        pfEl('profileModalTitle').textContent = title;
        var h = pfEl('hBaseUrl');
        h.hidden = (mode !== 'embedding');
        h.textContent = (mode === 'embedding') ? '留空则复用对话模型地址。' : '';
        pfEl('modalHint').textContent = (mode === 'profile')
            ? ''
            : '测试会真实调用一次服务商接口；保存后立即生效，无需重启。';
        combo.items = [];
        comboClose();
        applyProbeFields();
        pfEl('profileModal').hidden = false;
        document.body.style.overflow = 'hidden';
    }
    function closeModal() {
        comboClose();
        pfEl('profileModal').hidden = true;
        document.body.style.overflow = '';
    }
    function resetForm() {
        ['pfBaseUrl', 'pfApiKey', 'pfModelName',
         'pfTemperature', 'pfMaxTokens', 'pfDimensions']
            .forEach(function (id) { pfEl(id).value = ''; });
        var box = pfEl('profileResult');
        box.textContent = '';
        box.className = 'result';
        box.style.color = '';
        var probeBox = pfEl('probeResult');
        probeBox.textContent = '';
        probeBox.style.color = '';
    }

    /* ---------- 模型名下拉：从服务商拉候选（POST /admin/models） ---------- */
    var combo = { items: [], visible: [], loading: false, active: -1 };

    function comboMenu() { return pfEl('pfModelMenu'); }
    function comboOpen() {
        comboMenu().style.display = 'block';
        pfEl('pfModelName').setAttribute('aria-expanded', 'true');
    }
    function comboClose() {
        comboMenu().style.display = 'none';
        pfEl('pfModelName').setAttribute('aria-expanded', 'false');
        combo.active = -1;
    }
    function comboState(text) {
        comboMenu().innerHTML = '<div class="combo-state">' + Console.escapeHtml(text) + '</div>';
    }
    function comboRender() {
        var kw = pfEl('pfModelName').value.trim().toLowerCase();
        combo.visible = kw
            ? combo.items.filter(function (id) { return id.toLowerCase().indexOf(kw) >= 0; })
            : combo.items.slice();
        if (!combo.visible.length) {
            comboState(combo.items.length ? '无匹配项' : '没有可选模型');
            return;
        }
        comboMenu().innerHTML = combo.visible.map(function (id, i) {
            return '<div class="combo-item' + (i === combo.active ? ' active' : '') + '"'
                + ' role="option" data-id="' + Console.escapeHtml(id) + '">'
                + Console.escapeHtml(id) + '</div>';
        }).join('');
    }
    function comboPick(id) {
        pfEl('pfModelName').value = id;
        comboClose();
    }
    /* 目录接口吃的是 LlmSettings 形状：按当前模式映射到 chat* / embedding* */
    function catalogPayload() {
        return (MODE === 'embedding')
            ? { embeddingBaseUrl: val('pfBaseUrl'), embeddingApiKey: val('pfApiKey') }
            : { chatBaseUrl: val('pfBaseUrl'), chatApiKey: val('pfApiKey') };
    }
    function comboLoad() {
        if (!(pfEl('pfBaseUrl').value || '').trim()) {
            combo.items = [];
            comboState('请先填写服务商地址');
            comboOpen();
            return;
        }
        if (combo.loading) { return; }
        combo.loading = true;
        comboState('加载中…');
        comboOpen();
        Console.jsonRequest('/admin/models?type=' + (MODE === 'embedding' ? 'embedding' : 'chat'),
                            'POST', catalogPayload())
            .then(function (data) {
                if (!data || !data.success) {
                    combo.items = [];
                    comboState('连接失败：' + ((data && data.error) || '未知原因'));
                    return;
                }
                combo.items = data.models || [];
                comboRender();
                comboOpen();
            })
            .catch(function () { combo.items = []; comboState('连接失败：无法访问管控接口'); })
            .then(function () { combo.loading = false; });
    }

    (function () {
        var input = pfEl('pfModelName');
        pfEl('profileModal').querySelector('.combo-btn')
            .addEventListener('click', comboLoad);
        input.addEventListener('focus', function () {
            if (combo.items.length && comboMenu().style.display !== 'block') {
                comboRender();
                comboOpen();
            }
        });
        input.addEventListener('input', function () {
            if (comboMenu().style.display === 'block' && combo.items.length) { comboRender(); }
        });
        input.addEventListener('keydown', function (ev) {
            if (ev.key === 'Escape') {
                if (comboMenu().style.display === 'block') { ev.stopPropagation(); comboClose(); }
                return;
            }
            if (comboMenu().style.display !== 'block' || !combo.visible.length) { return; }
            var n = combo.visible.length;
            if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
                ev.preventDefault();
                combo.active = ev.key === 'ArrowDown' ? (combo.active + 1) % n : (combo.active - 1 + n) % n;
                comboRender();
                var act = comboMenu().querySelector('.combo-item.active');
                if (act && act.scrollIntoView) { act.scrollIntoView({ block: 'nearest' }); }
            } else if (ev.key === 'Enter') {
                ev.preventDefault();
                if (combo.active >= 0 && combo.visible[combo.active]) {
                    comboPick(combo.visible[combo.active]);
                } else {
                    comboClose();
                }
            }
        });
        comboMenu().addEventListener('click', function (ev) {
            var item = ev.target.closest ? ev.target.closest('.combo-item') : null;
            if (item) { comboPick(item.getAttribute('data-id')); }
        });
        document.addEventListener('click', function (ev) {
            if (!ev.target.closest || !ev.target.closest('.combo')) { comboClose(); }
        });
    })();

    /* ---------- 探测类型：实测判定 chat / embedding（顺带得维度与能力） ---------- */
    function probeSay(ok, text) {
        var el = pfEl('probeResult');
        el.textContent = text;
        el.style.color = ok ? '' : 'var(--red)';
    }
    function runProbe() {
        var baseUrl = (pfEl('pfBaseUrl').value || '').trim();
        var modelName = (pfEl('pfModelName').value || '').trim();
        if (!baseUrl || !modelName) { probeSay(false, '请先填写服务商地址与模型名'); return; }
        if (!val('pfApiKey')) { probeSay(false, '探测需要一个 API Key：请在左侧填写（编辑时也要重填）'); return; }
        var btn = pfEl('probeBtn');
        btn.disabled = true;
        probeSay(true, '探测中…（会发几次极短请求）');
        Console.jsonRequest('/admin/model-profiles/probe', 'POST',
                            { baseUrl: baseUrl, apiKey: val('pfApiKey'), modelName: modelName })
            .then(function (r) {
                if (!r || r.code !== 0 || !r.success) {
                    throw new Error((r && (r.detail || r.error)) || '探测失败');
                }
                PFEPS = r.endpoints || [];
                PFIN = r.input || [];
                PFOUT = r.output || [];
                PFCAPS = r.capabilities || [];
                PFKNOWN = true;
                if (r.dimension != null && !pfEl('pfDimensions').value) {
                    pfEl('pfDimensions').value = r.dimension;
                }
                applyProbeFields();
                probeSay(true, '');      /* 结果已由「模型类型 / 模型能力」呈现，不再附加解释 */
            })
            .catch(function (e) { probeSay(false, e.message); })
            .then(function () { btn.disabled = false; });
    }

    function openAdd() {
        resetForm();
        EDIT_ALIAS = null;
        PFEPS = [];
        PFIN = [];
        PFOUT = [];
        PFCAPS = [];
        PFKNOWN = false;
        openModal('profile', '添加模型');
        pfEl('pfBaseUrl').focus();
    }
    function openBuiltin(type) {
        if (!SETTINGS) { return; }
        resetForm();
        EDIT_ALIAS = null;
        if (type === 'embedding') {
            pfEl('pfBaseUrl').value = SETTINGS.embeddingBaseUrl || '';
            pfEl('pfModelName').value = SETTINGS.embeddingModelName || '';
            pfEl('pfDimensions').value = SETTINGS.embeddingDimensions == null ? '' : SETTINGS.embeddingDimensions;
            openModal('embedding', '编辑向量模型');
            PFCAPS = SETTINGS.embeddingCapabilities || [];
        }
        applyProbeFields();      /* openModal 里用空能力刷过一次，这里按已存能力再刷一遍 */
        pfEl('pfBaseUrl').focus();
    }
    function openProfileEdit(alias) {
        var p = PROFILES.filter(function (x) { return x.alias === alias; })[0];
        if (!p) { return; }
        resetForm();
        EDIT_ALIAS = alias;                 /* 别名不再可改，编辑时沿用原值 */
        PFEPS = p.endpoints || [];
        PFIN = p.input || [];
        PFOUT = p.output || [];
        PFCAPS = p.capabilities || [];
        PFKNOWN = true;
        pfEl('pfBaseUrl').value = p.baseUrl || '';
        pfEl('pfModelName').value = p.modelName || '';
        pfEl('pfTemperature').value = (p.temperature == null ? '' : p.temperature);
        pfEl('pfMaxTokens').value = (p.maxTokens == null ? '' : p.maxTokens);
        pfEl('pfDimensions').value = (p.dimensions == null ? '' : p.dimensions);
        openModal('profile', '编辑模型');
        showResult(true, '');
    }

    /* 别名已从表单移除：按模型名自动派生，重名加数字后缀（别名仍是绑定/删除用的键） */
    function deriveAlias(modelName) {
        var base = aliasBase(modelName);
        function taken(a) {
            return a === 'default'
                || PROFILES.some(function (p) { return p.alias === a; });
        }
        var alias = base, n = 2;
        while (taken(alias)) { alias = base + '-' + n; n++; }
        return alias;
    }

    function showResult(ok, message) {
        var box = pfEl('profileResult');
        box.className = 'result';
        box.style.color = ok ? '' : 'var(--red)';
        box.textContent = message;
    }

    /* ---------- 保存 ---------- */
    /* 保存对话 / 向量模型：/admin/settings 是整对象覆盖，
       所以另一组用当前已保存值占位，避免把对方配置抹掉；API Key 传 null = 不修改。 */
    function settingsPayload() {
        var p = {
            chatBaseUrl: SETTINGS.chatBaseUrl || null,
            chatApiKey: null,
            chatModelName: SETTINGS.chatModelName || null,
            chatTemperature: SETTINGS.chatTemperature == null ? null : SETTINGS.chatTemperature,
            chatMaxTokens: SETTINGS.chatMaxTokens == null ? null : SETTINGS.chatMaxTokens,
            chatCapabilities: SETTINGS.chatCapabilities || [],
            embeddingBaseUrl: SETTINGS.embeddingBaseUrl || null,
            embeddingApiKey: null,
            embeddingModelName: SETTINGS.embeddingModelName || null,
            embeddingDimensions: SETTINGS.embeddingDimensions == null ? null : SETTINGS.embeddingDimensions,
            embeddingCapabilities: SETTINGS.embeddingCapabilities || []
        };
        if (MODE === 'chat') {
            p.chatBaseUrl = val('pfBaseUrl');
            p.chatApiKey = val('pfApiKey');
            p.chatModelName = val('pfModelName');
            p.chatTemperature = num('pfTemperature');
            p.chatMaxTokens = num('pfMaxTokens');
            p.chatCapabilities = PFCAPS;
        } else {
            p.embeddingBaseUrl = val('pfBaseUrl');
            p.embeddingApiKey = val('pfApiKey');
            p.embeddingModelName = val('pfModelName');
            p.embeddingDimensions = num('pfDimensions');
            p.embeddingCapabilities = PFCAPS;
        }
        return p;
    }

    function saveSettings(btn, confirmedRebuild) {
        var handedOver = false;
        if (btn) { btn.disabled = true; }
        showResult(true, '保存中…');
        Console.jsonRequest('/admin/settings' + (confirmedRebuild ? '?rebuildIndex=true' : ''),
                            'POST', settingsPayload())
            .then(function (data) {
                if (!data.success) {
                    /* 向量维度变了：ES 索引维度建好后不可改，必须先重建索引 */
                    if (data.requiresRebuild) {
                        var ok = window.confirm(
                            '⚠️ 向量维度将由 ' + data.indexDimension + ' 变为 ' + data.newDimension
                            + '，与已建好的知识库索引不一致。\n\n'
                            + 'ES 索引的向量维度建好后无法修改，必须先重建索引，'
                            + '否则写入会被 ES 以维度不符拒绝。\n\n'
                            + '是否保存并立即重建知识库索引？\n'
                            + '（重建会删除并清空现有索引，已有文档需重新上传；取消则本次保存不生效。）');
                        if (ok) {
                            handedOver = true;
                            saveSettings(btn, true);
                            return;
                        }
                        showResult(false, '已取消，本次未保存。\n' + (data.error || ''));
                        return;
                    }
                    /* 配置已落盘、只是索引重建失败：状态照实刷新 */
                    if (data.saved) {
                        showResult(false, '⚠️ ' + data.error);
                        loadSettings();
                        return;
                    }
                    showResult(false, '保存失败：' + (data.error || '未知原因'));
                    return;
                }
                showResult(true, '已保存并立即生效');
                loadSettings().then(function () { closeModal(); });
            })
            .catch(function (e) { showResult(false, '请求失败：' + e.message); })
            .then(function () { if (!handedOver && btn) { btn.disabled = false; } });
    }

    function save() {
        if (!val('pfApiKey')) { showResult(false, '请填写 API Key'); return; }
        if (MODE !== 'profile') { saveSettings(pfEl('saveProfileBtn'), false); return; }
        var modelName = pfEl('pfModelName').value.trim();
        if (!modelName) { showResult(false, '请先填写模型名'); return; }
        /* 别名已从表单移除：编辑沿用原别名，新建按模型名派生 */
        var alias = EDIT_ALIAS || deriveAlias(modelName);
        var body = {
            alias: alias,
            endpoints: PFEPS,
            input: PFIN,
            output: PFOUT,
            baseUrl: pfEl('pfBaseUrl').value.trim(),
            apiKey: pfEl('pfApiKey').value,
            modelName: modelName,
            temperature: num('pfTemperature'),
            maxTokens: num('pfMaxTokens'),
            dimensions: num('pfDimensions'),
            capabilities: PFCAPS
        };
        Console.jsonRequest('/admin/model-profiles', 'POST', body)
            .then(function (r) {
                if (r && r.code && r.code !== 0) { throw new Error(r.detail || r.error || '保存失败'); }
                closeModal();
                loadProfiles();
            })
            .catch(function (e) { showResult(false, '保存失败：' + e.message); });
    }

    /* ---------- 测试 ---------- */
    /* 卡片上的「测试」= 用档案里已存的配置重新探测，结果写回档案 → 卡片标签随之刷新 */
    function testProfile(alias) {
        Console.jsonRequest('/admin/model-profiles/' + encodeURIComponent(alias) + '/probe', 'POST')
            .then(function (r) {
                if (r && r.code && r.code !== 0) { throw new Error(r.detail || r.error || '探测失败'); }
                return loadProfiles();
            })
            .catch(function (e) { alert('探测失败：' + e.message); });
    }

    /* 内置卡的「删除」= 清空该套内置配置（内置是全局兜底，必须二次确认） */
    function deleteBuiltin(kind) {
        var label = (kind === 'embedding') ? '向量模型' : '对话模型';
        if (!confirm('确认删除内置「' + label + '」？\n\n'
                + '会清空它的服务商地址 / API Key / 模型名等配置。\n'
                + '注意：内置是全局兜底 —— 清空后「未绑定任何模型」的域将没有可用模型。')) { return; }
        Console.jsonRequest('/admin/settings/' + encodeURIComponent(kind), 'DELETE')
            .then(function (r) {
                if (r && (r.success === false || (r.code && r.code !== 0))) {
                    throw new Error(r.error || r.detail || '删除失败');
                }
                return loadSettings();
            })
            .catch(function (e) { alert('删除失败：' + e.message); });
    }

    function deleteProfile(alias) {
        if (!confirm('确认删除模型 ' + alias + '？\n\n该模型会从所有域的绑定里一并移除（级联清理），'
                + '这些域将立即变为「无可调用模型」。')) { return; }
        Console.jsonRequest('/admin/model-profiles/' + encodeURIComponent(alias), 'DELETE')
            .then(function (r) {
                if (r && r.code && r.code !== 0) { throw new Error(r.detail || r.error || '删除失败'); }
                loadProfiles();
            })
            .catch(function (e) { alert('删除失败：' + e.message); });
    }

    /* ---------- 事件绑定 ---------- */
    pfEl('addModelBtn').addEventListener('click', openAdd);
    pfEl('probeBtn').addEventListener('click', runProbe);
    pfEl('saveProfileBtn').addEventListener('click', save);
    pfEl('resetProfileFormBtn').addEventListener('click', resetForm);
    pfEl('profileModalClose').addEventListener('click', closeModal);
    pfEl('profileModal').addEventListener('click', function (e) {
        if (e.target === pfEl('profileModal')) { closeModal(); }
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !pfEl('profileModal').hidden) { closeModal(); }
    });

    Console.ready(function () {
        loadSettings();
        loadProfiles();
    });
</script>
</body>
</html>
