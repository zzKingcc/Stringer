server:
  port: 8080

stringer:
  # 服务端地址与账号只写一份：客户端与工具实例共用（服务端只有一个账号、一份工具注册表）
  server:
    host: ${STRINGER_SERVER_HOST:localhost}
    port: ${STRINGER_SERVER_PORT:9527}
    username: ${STRINGER_SERVER_USERNAME:stringer}
    password: ${STRINGER_SERVER_PASSWORD:stringer}
  client:
    health-check-timeout: 5s
  tool-instance:
    enabled: true
    instance-id: ${STRINGER_INSTANCE_ID:example-8080}
    # 回流地址留空即按本进程端口推导（本示例与服务端同机）。跨机部署、想走反代时必须显式配置：
    # endpoint: ${STRINGER_INSTANCE_ENDPOINT:http://10.0.0.5:8081/stringer/invoke}
    heartbeat-interval-seconds: 5

# ========== 日志 ==========
logging:
  level:
    com.zzkingcc.stringer: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n%ex"
